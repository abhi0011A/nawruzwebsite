<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Naw-Ruz Foundation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#0f172a;--accent:#f97316;--accent-hover:#ea580c;--bg:#f8fafc;--card:#fff;--text:#0f172a;--text-light:#64748b;--font:'Inter',sans-serif}
        body{font-family:var(--font);background:var(--bg);color:var(--text);padding-top:60px}
        @media(min-width:768px){body{padding-top:68px}}
        .wrap{max-width:420px;margin:40px auto;padding:0 16px}
        .card{background:var(--card);border-radius:16px;padding:28px 22px;border:1px solid rgba(15,23,42,.05);box-shadow:0 4px 12px rgba(0,0,0,.04)}
        .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:50px;padding:4px;margin-bottom:22px}
        .tab{padding:10px;border:none;background:none;border-radius:50px;font-weight:600;font-size:.85rem;cursor:pointer;font-family:var(--font);color:var(--text-light)}
        .tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.08)}
        h2{font-size:1.25rem;color:var(--primary);margin-bottom:4px}
        .sub{font-size:.82rem;color:var(--text-light);margin-bottom:18px}
        .field{margin-bottom:14px}
        .field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:5px}
        .field input{width:100%;padding:11px 14px;border:1px solid rgba(15,23,42,.12);border-radius:10px;font-size:.9rem;font-family:var(--font);background:var(--bg);outline:none}
        .field input:focus{border-color:var(--accent)}
        .btn{width:100%;padding:13px;border:none;border-radius:50px;background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;font-weight:600;font-size:.9rem;cursor:pointer;font-family:var(--font)}
        .btn:disabled{opacity:.6;cursor:not-allowed}
        .msg{margin-top:12px;font-size:.85rem;min-height:1.2em}
        .hidden{display:none}
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="wrap">
    <div class="card">
        <div class="tabs">
            <button class="tab active" id="tabLogin" type="button" onclick="showTab('login')">Login</button>
            <button class="tab" id="tabRegister" type="button" onclick="showTab('register')">Register</button>
        </div>

        <form id="loginForm">
            <h2>Welcome back</h2>
            <p class="sub">Log in to your Naw-Ruz account.</p>
            <div class="field">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button class="btn" type="submit" id="loginBtn">Login</button>
            <p class="msg" id="loginMsg"></p>
        </form>

        <form id="registerForm" class="hidden">
            <h2>Create an account</h2>
            <p class="sub">Register to keep track of your enquiries and donations.</p>
            <div class="field">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Your full name" required>
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="your@email.com" required>
            </div>
            <div class="field">
                <label>Password (min 6 characters)</label>
                <input type="password" id="regPassword" minlength="6" required>
            </div>
            <button class="btn" type="submit" id="registerBtn">Create Account</button>
            <p class="msg" id="registerMsg"></p>
        </form>
    </div>
</div>

<div id="footer-placeholder"></div>

<script src="nav.js"></script>
<script src="footer.js"></script>
<script>
    const AUTH_API = 'http://localhost:8080/api/auth';
    const TOKEN_KEY = 'nawruz_token';

    function showTab(which) {
        const isLogin = which === 'login';
        document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
        document.getElementById('registerForm').classList.toggle('hidden', isLogin);
        document.getElementById('tabLogin').classList.toggle('active', isLogin);
        document.getElementById('tabRegister').classList.toggle('active', !isLogin);
    }

    function setMsg(id, text, ok) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.style.color = ok ? '#059669' : '#dc2626';
    }
    function goNext() {
        var next = new URLSearchParams(window.location.search).get('next');
        var safe = (next && /^[\w.-]+\.html$/.test(next)) ? next : 'index.html';
        window.location.href = safe;
    }
    async function postJson(path, body) {
        const res = await fetch(AUTH_API + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        let data = {};
        try { data = await res.json(); } catch (e) {}
        return { ok: res.ok, status: res.status, data };
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        setMsg('loginMsg', 'Logging in...', true);
        try {
            const r = await postJson('/login', {
                email: document.getElementById('loginEmail').value.trim(),
                password: document.getElementById('loginPassword').value
            });
            if (!r.ok) {
                setMsg('loginMsg', r.status === 401 ? 'Wrong email or password.' : 'Login failed. Please try again.', false);
                return;
            }
            localStorage.setItem(TOKEN_KEY, r.data.token);
                        goNext();
        } catch (err) {
            console.error(err);
            setMsg('loginMsg', 'Could not reach the server. Is the backend running?', false);
        } finally {
            btn.disabled = false;
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('registerBtn');
        btn.disabled = true;
        setMsg('registerMsg', 'Creating your account...', true);
        try {
            const r = await postJson('/register', {
                fullName: document.getElementById('regName').value.trim(),
                email: document.getElementById('regEmail').value.trim(),
                password: document.getElementById('regPassword').value
            });
            if (!r.ok) {
                setMsg('registerMsg', r.data.error || 'Registration failed. Please try again.', false);
                return;
            }
            localStorage.setItem(TOKEN_KEY, r.data.token);
                       goNext();
        } catch (err) {
            console.error(err);
            setMsg('registerMsg', 'Could not reach the server. Is the backend running?', false);
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
